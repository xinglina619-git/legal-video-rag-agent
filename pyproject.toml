[project]
name = "legal-multimodal-rag-agent"
version = "0.1.0"
description = "Multimodal evidence normalization, legal retrieval, and human-reviewed report drafting."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "streamlit>=1.40", "python-multipart>=0.0.12", "pydantic>=2.9", "pydantic-settings>=2.6", "python-dotenv>=1.0", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "qdrant-client[fastembed]>=1.12", "langchain>=1.0", "langchain-openai>=0.3", "langchain-ollama>=0.3", "langgraph>=0.2", "langgraph-checkpoint-sqlite>=2.0", "pymupdf>=1.24", "docx2txt>=0.9", "python-docx>=1.1", "reportlab>=4.2", "beautifulsoup4>=4.12"]
[project.optional-dependencies]
media = ["faster-whisper>=1.1", "rapidocr-onnxruntime>=1.3"]
diarization = ["pyannote.audio>=3.3"]
worker = ["redis>=5", "rq>=2"]
dev = ["pytest>=8.3", "ruff>=0.8"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.setuptools]
packages = ["app", "app.routers", "app.services"]
