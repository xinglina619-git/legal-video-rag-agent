services:
  postgres:
    image: postgres:16-alpine
    environment:
      # 本地 Demo 默认值；生产环境必须通过 .env.local、Secrets 或密钥管理服务覆盖。
      POSTGRES_DB: ${POSTGRES_DB:-legal_agent}
      POSTGRES_USER: ${POSTGRES_USER:-legal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
    ports: ["5433:5432"]
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6334:6333"]
